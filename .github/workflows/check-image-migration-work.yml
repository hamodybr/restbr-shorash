name: Check image migration work

on:
  push:
    branches:
      - work/image-migration-20260901
    paths:
      - .github/workflows/check-image-migration-work.yml
      - js/admin-image-migration-once.js
      - supabase/functions/migrate-menu-images/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript
        run: node --check js/admin-image-migration-once.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function TypeScript
        run: deno check supabase/functions/migrate-menu-images/index.ts
      - name: Ensure browser runner has no service role secret
        run: |
          ! grep -qi 'service_role\|SUPABASE_SERVICE_ROLE_KEY' js/admin-image-migration-once.js
