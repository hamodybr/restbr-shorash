name: Shorash branding once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/shorash-branding-once.yml

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Shorash branding
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('js/runtime-config.js'): [
                  (b"restaurantName: 'Restaurant'", b"restaurantName: 'SHORASH'"),
              ],
              Path('manifest.webmanifest'): [
                  (b'"name": "Restaurant Menu"', b'"name": "SHORASH Restaurant Menu"'),
                  (b'"short_name": "Restaurant"', b'"short_name": "SHORASH"'),
                  (b'"description": "Restaurant menu and ordering experience"', b'"description": "SHORASH Restaurant menu and ordering experience"'),
              ],
              Path('index.html'): [
                  (b'<meta name="apple-mobile-web-app-title" content="Restaurant Menu">', b'<meta name="apple-mobile-web-app-title" content="SHORASH Menu">'),
                  (b'<title>Restaurant Menu</title>', b'<title>SHORASH Menu</title>'),
                  (b'<link rel="manifest" href="manifest.webmanifest">', b'<link rel="manifest" href="manifest.webmanifest?v=1.1">'),
              ],
              Path('admin.html'): [
                  ('<title>Restaurant — Admin Dashboard</title>'.encode('utf-8'), '<title>SHORASH — Admin Dashboard</title>'.encode('utf-8')),
              ],
          }

          for path, pairs in replacements.items():
              data = path.read_bytes()
              for old, new in pairs:
                  count = data.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence, found {count}')
                  data = data.replace(old, new, 1)
              path.write_bytes(data)
          PY

      - name: Verify branding patch
        run: |
          grep -q "restaurantName: 'SHORASH'" js/runtime-config.js
          grep -q '"name": "SHORASH Restaurant Menu"' manifest.webmanifest
          grep -q '"short_name": "SHORASH"' manifest.webmanifest
          grep -q '<title>SHORASH Menu</title>' index.html
          grep -q '<title>SHORASH — Admin Dashboard</title>' admin.html
          grep -q 'manifest.webmanifest?v=1.1' index.html
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' admin.html index.html js/runtime-config.js manifest.webmanifest | sort)"
          test "$(git diff --numstat admin.html | awk '{print $1":"$2}')" = "1:1"
          test "$(git diff --numstat index.html | awk '{print $1":"$2}')" = "3:3"
          test "$(git diff --numstat js/runtime-config.js | awk '{print $1":"$2}')" = "1:1"
          test "$(git diff --numstat manifest.webmanifest | awk '{print $1":"$2}')" = "3:3"

      - name: Commit branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/runtime-config.js manifest.webmanifest index.html admin.html
          git commit -m "brand: apply Shorash identity"
          git push origin HEAD:main
