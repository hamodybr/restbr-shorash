<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHORASH CONNECT</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f4f3ef;color:#19271f;margin:0}main{max-width:680px;margin:auto;padding:18px}header{background:#172820;color:#e9d1a4;padding:22px;border-radius:15px;margin-bottom:16px}h1{font-size:23px;margin:0 0 4px}small{color:#777}section,.worker{background:white;border:1px solid #ddd;border-radius:12px;padding:15px;margin:10px 0}label{display:block;margin:8px 0}input,select,button{font:inherit;padding:12px;border:1px solid #ccc;border-radius:8px}input,select{width:100%}button{background:#246648;color:white;border:0;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.alt{background:#eceae5;color:#222}button.talk{touch-action:none;user-select:none;-webkit-user-select:none}button.live{background:#b02a2a}.worker{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.worker div{flex:1;min-width:90px}.online{color:#246648}.offline{color:#777}#status{padding:12px;background:#e5ece6;border-radius:8px;min-height:44px}#notice{font-size:22px;color:#934600} [hidden]{display:none!important}#hold{width:100%;padding:18px;margin-top:8px}
</style><main><header><h1>SHORASH CONNECT</h1><small style="color:#e9d1a4">تجربة الاتصال الداخلي · Pilot</small></header>
<div id="status" role="status">غير متصل</div><section id="login"><label>نوع الجهاز<select id="role"><option value="admin">الإدارة / الكاشير</option><option value="worker">تابلت النادل</option></select></label><label id="workerField" hidden>رمز النادل<input id="workerId" autocomplete="off"></label><label>رمز الدخول الخاص بالجهاز<input id="code" type="password" autocomplete="off"></label><button id="join">اتصال وتفعيل الصوت</button></section>
<section id="admin" hidden><div id="roster"></div><div id="selected"></div><button id="hold" class="talk" disabled>اضغط باستمرار للتحدث 🎙️</button><button id="end" class="alt" hidden>إنهاء الاتصال</button></section>
<section id="receiver" hidden><h2>استقبال النداءات</h2><p>اترك هذه الصفحة مفتوحة أثناء تجربة النظام.</p><div id="notice" role="alert"></div></section>
<button id="leave" class="alt" hidden>قطع الاتصال</button><p><small>لا يسجل النظام الصوت ولا يطلب إذن ميكروفون النادل.</small></p></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let ws,role,pc,call,target,transceiver,held=false,mic,ctx,source,gen=0,busy=false,ready=false,alertTimer;
const status=t=>$('status').textContent=t;
function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m));}
function unlock(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx.resume();}
function tone(){if(!ctx||ctx.state!=='running')return;for(const [i,f] of [780,1040,780].entries()){const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.19;o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.17);}}
function release(){held=false;gen++;$('hold').classList.remove('live');const tracks=mic?.getTracks()||[];mic=null;for(const t of tracks)t.stop();if(transceiver)transceiver.sender.replaceTrack(null).catch(()=>{});}
function closePeer(notify=true){release();if(notify&&call)send({type:'end',call});call=null;target=null;ready=false;busy=false;source?.disconnect();source=null;pc?.close();pc=null;transceiver=null;$('hold').disabled=true;$('end').hidden=true;$('selected').textContent='';}
function newPeer(){const p=new RTCPeerConnection({iceServers:[]});pc=p;p.onconnectionstatechange=()=>{if(pc!==p)return;if(p.connectionState==='connected'){ready=true;if(role==='admin')$('hold').disabled=false;status(role==='admin'?'جاهز — اضغط للتحدث':'متصل بالإدارة');}else if(['failed','closed','disconnected'].includes(p.connectionState)){ready=false;release();$('hold').disabled=true;status('الاتصال الصوتي غير مستقر؛ أعد الاختيار');}};return p;}
async function gather(p){if(p.iceGatheringState==='complete')return;await new Promise(resolve=>{let timer;const done=()=>{clearTimeout(timer);p.removeEventListener('icegatheringstatechange',check);resolve();};const check=()=>{if(p.iceGatheringState==='complete')done();};timer=setTimeout(done,4000);p.addEventListener('icegatheringstatechange',check);check();});}
async function selectWorker(w){if(busy||call||pc){status('أنه الاتصال الحالي قبل اختيار نادل آخر');return;}busy=true;target=w.id;$('selected').textContent='النادل: '+w.name;$('end').hidden=false;status('جاري تهيئة الصوت…');const p=newPeer();transceiver=p.addTransceiver('audio',{direction:'sendonly'});try{await p.setLocalDescription(await p.createOffer());await gather(p);if(pc===p)send({type:'offer',target:w.id,sdp:p.localDescription.sdp});}catch{closePeer();status('تعذر إنشاء اتصال صوتي');}}
function roster(workers){const div=$('roster');div.replaceChildren();for(const w of workers){const row=document.createElement('div');row.className='worker';const info=document.createElement('div'),name=document.createElement('strong'),state=document.createElement('small');name.textContent=w.name;state.textContent=w.online?'● متصل':'● غير متصل';state.className=w.online?'online':'offline';info.append(name,document.createElement('br'),state);const talk=document.createElement('button');talk.textContent='🎙️ اختيار';talk.disabled=!w.online;talk.onclick=()=>selectWorker(w);const bell=document.createElement('button');bell.className='alt';bell.textContent='🔔 تنبيه';bell.disabled=!w.online;bell.onclick=()=>send({type:'alert',target:w.id});row.append(info,talk,bell);div.append(row);}}
async function onMessage(e){let m;try{m=JSON.parse(e.data);}catch{return;}try{
if(m.type==='ready'){status('متصل بالشبكة');$('login').hidden=true;$(role==='admin'?'admin':'receiver').hidden=false;$('leave').hidden=false;}
else if(m.type==='roster'&&role==='admin')roster(m.workers);
else if(m.type==='sent')status('أُرسل التنبيه إلى الجهاز (لا يعني أن النادل سمعه)');
else if(m.type==='error'){closePeer(false);status(m.message);}
else if(m.type==='alert'&&role==='worker'){tone();navigator.vibrate?.([120,90,120]);$('notice').textContent='🔔 تنبيه من الإدارة';clearTimeout(alertTimer);alertTimer=setTimeout(()=>$('notice').textContent='',5000);}
else if(m.type==='session'&&role==='admin'){call=m.call;busy=false;}
else if(m.type==='offer'&&role==='worker'){closePeer(false);call=m.call;const p=newPeer();p.ontrack=ev=>{if(pc!==p)return;source?.disconnect();source=ctx.createMediaStreamSource(new MediaStream([ev.track]));source.connect(ctx.destination);};await p.setRemoteDescription({type:'offer',sdp:m.sdp});await p.setLocalDescription(await p.createAnswer());await gather(p);if(pc===p)send({type:'answer',call:m.call,sdp:p.localDescription.sdp});}
else if(m.type==='answer'&&role==='admin'&&call===m.call&&pc)await pc.setRemoteDescription({type:'answer',sdp:m.sdp});
else if(m.type==='end'&&call===m.call){closePeer(false);status('انتهى الاتصال');}
}catch{closePeer();status('تعذر تهيئة الصوت');}}
$('role').onchange=()=>$('workerField').hidden=$('role').value!=='worker';
$('join').onclick=async()=>{if(ws)return;role=$('role').value;const code=$('code').value,id=$('workerId').value.trim();if(!code||(role==='worker'&&!id)){status('أدخل بيانات الدخول');return;}try{await unlock();}catch{status('تعذر تفعيل الصوت');return;}const s=new WebSocket('wss://'+location.host+'/ws');ws=s;$('join').disabled=true;s.onopen=()=>{send({type:'auth',role,id,code});$('code').value='';};s.onmessage=onMessage;s.onerror=()=>status('خطأ بالشبكة أو الشهادة');s.onclose=()=>{if(ws!==s)return;ws=null;closePeer(false);$('login').hidden=false;$('admin').hidden=true;$('receiver').hidden=true;$('leave').hidden=true;$('join').disabled=false;status('انقطع الاتصال أو بيانات الدخول غير صحيحة؛ أعد الاتصال');};};
$('leave').onclick=()=>ws?.close();$('end').onclick=()=>{closePeer();status('انتهى الاتصال');};
$('hold').onpointerdown=async e=>{e.preventDefault();if(!ready||!transceiver||held)return;try{$('hold').setPointerCapture(e.pointerId);}catch{}held=true;const token=++gen;const t=transceiver;try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});if(!held||gen!==token||t!==transceiver){stream.getTracks().forEach(x=>x.stop());return;}mic=stream;await t.sender.replaceTrack(stream.getAudioTracks()[0]);if(held&&gen===token){$('hold').classList.add('live');status('🔴 تحدث الآن');}else stream.getTracks().forEach(x=>x.stop());}catch{release();status('تعذر تشغيل الميكروفون؛ تحقق من إذن Safari وشهادة HTTPS');}};
for(const type of ['pointerup','pointercancel','lostpointercapture'])$('hold').addEventListener(type,()=>{if(held){release();if(ready)status('جاهز — اضغط للتحدث');}});
window.addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release();});window.addEventListener('pagehide',()=>{release();ws?.close();});
</script></html>
