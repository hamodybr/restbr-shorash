<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080604">
  <meta name="color-scheme" content="dark">
  <title>SHORASH Staff Menu</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="header">
      <img class="logo" src="./assets/shorash-logo.jpeg" alt="Shorash">
      <div class="identity"><h1 id="heading">منيو شورش</h1><p id="tagline">خاص بالكرسون · عرض فقط</p></div>
      <div class="connection" id="connection" aria-live="polite">—</div>
    </header>
    <div class="toolbar">
      <div class="modes" role="group" aria-label="Service mode">
        <button id="modeDinein" class="selected" type="button">داخل المطعم</button>
        <button id="modeTakeaway" type="button">سفري</button>
      </div>
      <div class="languages" role="group" aria-label="Language">
        <button type="button" data-lang="ar" class="selected">عربي</button>
        <button type="button" data-lang="ku">کوردی</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </div>
    <div class="search-row">
      <input id="search" type="search" placeholder="ابحث عن صنف..." autocomplete="off" aria-label="Search">
      <button id="syncBtn" type="button">تحديث المنيو</button>
    </div>
    <div class="sync-state" aria-live="polite">
      <span id="savedStatus"></span><span id="message"></span>
    </div>
    <nav class="categories" id="categories" aria-label="Categories"></nav>
    <main id="menu" class="menu"></main>
    <footer class="footer">SHORASH · STAFF EDITION · OFFLINE FIRST</footer>
  </div>
</body>
</html>
